<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Questionário Recreativo</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <main class="card">
            <!-- FRASE EM FRANCÊS -->
            <p style="text-align: center; font-style: italic; color: #b3b3b3; font-size: 14px; margin-bottom: 20px;">
                "Quelle chance j'ai"
            </p>

            <h1>🧠 Bem-vindo ao Quiz de Afinidades</h1>
            <p>Responda às perguntas para descobrir o seu perfil detalhado.</p>
            
            <!-- Área onde as perguntas vão carregar -->
            <div id="area-perguntas" style="max-height: 300px; overflow-y: auto; margin: 20px 0; padding-right: 10px;">
                <p style="color: #ccc;">Carregando questionário...</p>
            </div>

            <!-- Bloco de Privacidade (LGPD) -->
            <div class="bloco-privacidade" style="margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 5px; border: 1px solid rgba(255,255,255,0.1);">
                <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; text-align: left;">
                    <input type="checkbox" id="chk-lgpd">
                    <span style="color: white; font-size: 14px;">
                        📄 Li e concordo com a 
                        <a href="privacidade.html" target="_blank" style="color: #3b82f6; font-weight: bold; text-decoration: underline;">
                            Política de Privacidade
                        </a> 
                        e autorizo o tratamento anônimo das minhas respostas.
                    </span>
                </label>
            </div>

            <!-- Botão para avançar -->
            <button id="btn-iniciar" class="btn" style="width: 100%; padding: 12px; background: #3cbf7e; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
                Iniciar Questionário
            </button>
        </main>
    </div>

    <!-- Script Oficial do Supabase (A ponte que faltava!) -->
    <script src="https://jsdelivr.net"></script>
    <!-- Conecta com o seu arquivo de lógica -->
    <script src="perguntas.js"></script>
</body>
</html>
